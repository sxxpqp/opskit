name: CI and packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate release configuration
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET: ${{ vars.MINIO_BUCKET || 'opskit' }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Only stable vX.Y.Z tags are supported by the update channel" >&2; exit 1
          fi
          for name in MINIO_ENDPOINT MINIO_ACCESS_KEY MINIO_SECRET_KEY UPDATE_SIGNING_PRIVATE_KEY UPDATE_PUBLIC_KEY; do
            if [ -z "${!name}" ]; then echo "Missing GitHub Actions configuration: $name" >&2; exit 1; fi
          done
          go run ./cmd/release-publish --validate-config
      - name: Build binaries
        env:
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              name="opskit_${os}_${arch}"
              suffix=""
              if [ "$os" = windows ]; then suffix=.exe; fi
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}-${GITHUB_SHA:0:7} -X github.com/sxxpqp/opskit/internal/app.updatePublicKey=${UPDATE_PUBLIC_KEY}" -o "dist/$name$suffix" ./cmd/opskit
            done
          done
          cp config.example.yaml dist/config.example.yaml
          (cd dist && sha256sum opskit_* config.example.yaml > checksums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: opskit-packages
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: opskit-packages
          path: dist
      - name: Generate primary and Nexus download links
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/download_links.py --tag "$TAG" --output /tmp/opskit-download-links.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes --notes-file /tmp/opskit-download-links.md --title "$TAG"

  publish-minio:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: minio-stable-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: opskit-packages
          path: dist
      - name: Upload, verify and publish signed stable index
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET: ${{ vars.MINIO_BUCKET || 'opskit' }}
          MINIO_REGION: ${{ vars.MINIO_REGION || 'us-east-1' }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          export BUILD_VERSION="${RELEASE_TAG}-${GITHUB_SHA:0:7}"
          go run ./cmd/release-publish --dist dist

  update-downloads:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: homepage-download-links
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update homepage to latest published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Resolve GitHub's actual latest release, even if an older tag finishes later.
          tag="$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')"
          python3 scripts/download_links.py --tag "$tag" --readme --update-version
          if git diff --quiet -- README.md downloads.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md downloads.json
          git commit -m "docs: sync homepage and downloads to $tag"
          git push origin HEAD:main
