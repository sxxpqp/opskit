name: CI and packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              name="opskit_${os}_${arch}"
              suffix=""
              if [ "$os" = windows ]; then suffix=.exe; fi
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}-${GITHUB_SHA:0:7}" -o "dist/$name$suffix" ./cmd/opskit
            done
          done
          cp config.example.yaml dist/config.example.yaml
          (cd dist && sha256sum opskit_* config.example.yaml > checksums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: opskit-packages
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: opskit-packages
          path: dist
      - name: Generate primary and Nexus download links
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/download_links.py --tag "$TAG" --output /tmp/opskit-download-links.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes --notes-file /tmp/opskit-download-links.md --title "$TAG"

  update-downloads:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: homepage-download-links
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update homepage to latest published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Resolve GitHub's actual latest release, even if an older tag finishes later.
          tag="$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')"
          python3 scripts/download_links.py --tag "$tag" --readme --update-version
          if git diff --quiet -- README.md downloads.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md downloads.json
          git commit -m "docs: sync homepage and downloads to $tag"
          git push origin HEAD:main
