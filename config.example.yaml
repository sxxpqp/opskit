# opskit 配置模板：执行 opskit config init，或复制此文件为 ./config/config.yaml。
# 默认场景：在 kubeadm 控制平面节点上备份本机 etcd；不填写 bucket 时仅本地备份。
# K3s、RKE2、外置 etcd、自定义证书目录等环境，请修改下面的地址与证书路径。
# 当前工作目录决定默认加载位置；--config 可指定其他文件，不自动合并配置。
# 优先级：命令行参数 > 已支持的环境变量 > 此配置 > 程序内置默认值。
# 路径：配置中的相对路径以本文件所在目录为准；绝对路径原样使用。
# 不执行 ${ENV_VAR}、~、日期变量或其他模板展开；凭据按下方环境变量方式传入。

schema_version: 1

# 固定安装版本；CLI --version 可覆盖。KS 当前仅支持内嵌的 v3.4.1 清单。
versions:
  docker: v27.3.1
  cri_dockerd: v0.3.22
  containerd: v2.1.3
  runc: v1.2.6
  cni_plugins: v1.5.1
  kind: v0.17.0
  kubernetes: v1.24.7
  kubesphere: v3.4.1

# Linux systemd 主机安装；默认执行，--dry-run 仅预览。不覆盖已有运行时。
# URL 仅用于安装文件；容器镜像源仍统一由 mirrors 管理。
install:
  download_dir: ""  # 默认用户目录 ~/.opskit/downloads（Windows 为 %USERPROFILE%\.opskit\downloads）；可覆盖
  docker_method: script  # script / binary
  docker_mirror: Aliyun  # 官方脚本软件包源，注意大小写
  docker_script: https://get.docker.com
  docker_binary_base: https://mirrors.aliyun.com/docker-ce/linux/static/stable
  release_base: https://nexus.ihome.sxxpqp.top:8443/repository/raw-github

# kind 测试集群，不会连接或覆盖现有生产集群。
kind:
  name: kubesphere-341
  workers: 2
  # 留空使用默认 ~/.kube/kind-<name>.config；相对路径以本配置文件为基准。
  kubeconfig: ""
  # 留空先查版本隔离安装目录，再查 PATH；不要求用户安装 Go。
  binary: ""
  console_port: 30880

# 项目镜像源基线：迁移自 linux/docker/containerd/mirrors.sh、docker/docker-mirror.sh
# 以及 docs/infra-reference.md、aliyun-mirrors.md；内网地址需要运行环境可达。
# 默认只预览，--apply 才备份并写入；容器清单保持上游 image。
mirrors:
  docker:
    - https://dockerhub.ihome.sxxpqp.top:8443
  # 沿用原 Docker 脚本的内网证书兼容设置；有可信证书时可删除相应项。
  docker_insecure_registries:
    - dockerhub.ihome.sxxpqp.top:8443
    - ghcr.ihome.sxxpqp.top:8443
    - quay.ihome.sxxpqp.top:8443
    - k8s.ihome.sxxpqp.top:8443
  containerd:
    docker.io:
      server: https://registry-1.docker.io
      endpoint: https://huball.ihome.sxxpqp.top:8443/v2/dockerhub
      skip_verify: true
      override_path: true
    registry.k8s.io:
      server: https://registry.k8s.io
      endpoint: https://huball.ihome.sxxpqp.top:8443/v2/google_containers
      skip_verify: true
      override_path: true
    k8s.gcr.io:
      server: https://k8s.gcr.io
      endpoint: https://huball.ihome.sxxpqp.top:8443/v2/google_containers
      skip_verify: true
      override_path: true
    quay.io:
      server: https://quay.io
      endpoint: https://huball.ihome.sxxpqp.top:8443/v2/quay
      skip_verify: true
      override_path: true
    ghcr.io:
      server: https://ghcr.io
      endpoint: https://huball.ihome.sxxpqp.top:8443/v2/ghcr
      skip_verify: true
      override_path: true
    registry.cn-hangzhou.aliyuncs.com:
      server: https://registry.cn-hangzhou.aliyuncs.com
  go: https://goproxy.cn,direct
  npm: https://registry.npmmirror.com
  pip: https://pypi.tuna.tsinghua.edu.cn/simple/
  maven: https://maven.aliyun.com/repository/public

kubesphere:
  # 留空读取唯一默认 StorageClass；不会自动安装 OpenEBS/NFS 或把 SC 改成默认。
  storage_class: ""
  # 沿用原 kind 流程的公开安装器源；仅 --kind 预加载时读取。
  # 自建集群继续使用上游 image；此项不是个人阿里云 ACR 账号。
  installer_source: registry.cn-beijing.aliyuncs.com/kubesphereio/ks-installer:v3.4.1
  # 留空在 ~/.kube 中生成 0600 初始密码文件，不输出明文。
  password_file: ""

# 整个任务的总期限；备份包含快照 + 校验 + 上传。支持 30s、10m、1h 等。
# 检查任务也会读取此值；建议运行 s3 check --timeout 15s / etcd check --timeout 30s。
timeout: 1h

etcd:
  # 备份使用单个客户端 API 地址，端口通常为 2379；不要使用 peer 端口 2380。
  # etcd check 会从该入口发现全部成员，检查成员健康、节点数量和 Leader。
  # 检查时也可用 --endpoint https://node1:2379,https://node2:2379 传多个种子地址。
  # 此默认值适用于 kubeadm 控制平面节点上的本地 etcd。
  # 远程备份改成证书 SAN 包含的地址，并确认服务监听与防火墙允许连接。
  endpoint: https://127.0.0.1:2379

  # 本地备份根目录；每次生成独立任务子目录，内含 snapshot.db 和 manifest.json。
  # 上传失败也保留本地快照；当前不会自动轮转或删除旧备份。
  directory: ../data/backups/etcd

  # 官方客户端的可执行文件名或路径，需要自行安装并匹配 etcd 版本。
  # 裸名称从 PATH 查找；./bin/etcdctl 等路径相对于本配置文件。
  etcdctl: etcdctl

  # kubeadm 常见的 etcd CA 与健康检查客户端证书（不是 Kubernetes 根 CA）。
  # 这些是模板中启用的配置值；不加载配置时，程序不会自动搜索这些路径。
  # 运行用户需能读取证书和私钥；cert 与 key_file 必须成对配置。
  cacert: /etc/kubernetes/pki/etcd/ca.crt
  cert: /etc/kubernetes/pki/etcd/healthcheck-client.crt
  key_file: /etc/kubernetes/pki/etcd/healthcheck-client.key

  # 若使用无 TLS 的本地开发 etcd，请同时修改：
  # endpoint: http://127.0.0.1:2379
  # cacert: ""
  # cert: ""
  # key_file: ""
  # 若 etcd 启用了用户名密码认证，另设置 ETCDCTL_USER='用户名:密码'。
  # 配置中的非空连接字段会作为 etcdctl 参数传递，优先于对应 ETCDCTL_* 环境变量。

s3:
  # 配好后执行 opskit s3 check --timeout 15s 检查桶访问，不写入测试对象。
  # 选择要使用的厂家：minio / aws / custom。只读取所选配置块。
  # 选 minio 就只需填写 minio 下的空项；不需要修改 aws/custom。
  # 所选块的 bucket 留空时仅本地备份，填写后自动上传。
  provider: minio

  minio:
    # 必填：S3 API 入口，如 https://minio.example.com:9000。
    # 不是 Web Console 地址，不包含 bucket 或对象 key。
    endpoint: ""
    # 必填：已创建的桶名，如 k8s-backups；程序不会创建桶。
    bucket: ""
    # MinIO 服务账号的 Access Key / Secret Key，需成对填写。
    # 也可以都留空，通过 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
    # 或 SDK 默认凭据链提供；YAML 凭据填写后优先于默认凭据链。
    access_key: ""
    secret_key: ""
    # 临时凭据才需要；长期账号保持空。
    session_token: ""
    # 已预设 MinIO 常用值，服务未自定义时无需修改。
    region: us-east-1
    path_style: true
    # 对象完整名称，不是访问密钥，也不是目录前缀。
    # 留空自动生成 etcd/<UTC时间-随机任务号>/snapshot.db，推荐定时备份使用。
    # 固定 key（如 manual/snapshot.db）不自动追加文件名，重复上传不会覆盖。
    key: ""

  aws:
    # 使用 AWS 时只需改 provider: aws，再填写本块。
    bucket: ""
    # 改为实际桶所在区域，如 ap-southeast-1。
    region: us-east-1
    # AWS 通常不填 endpoint，由 SDK 按区域选择。
    endpoint: ""
    path_style: false
    # IAM 角色 / AWS profile 用户保持为空，自动使用 SDK 默认凭据链。
    access_key: ""
    secret_key: ""
    session_token: ""
    key: ""

  custom:
    # 其他 S3 兼容厂家：选择 provider: custom 后按服务文档填本块。
    # S3 兼容性、条件写入等能力需实际验证。
    endpoint: ""
    bucket: ""
    region: us-east-1
    path_style: true
    access_key: ""
    secret_key: ""
    session_token: ""
    key: ""

  # 通用说明：
  # 1. 不合并不同厂家配置；未选择块中的 endpoint/凭据不会用于上传。
  # 2. 密钥可以填在本地 opskit.yaml，勿提交到仓库；config init 创建权限为 0600。
  # 3. 配置不展开 ${...} 或日期变量；需要环境凭据时将 YAML 凭据都留空。
  # 4. 远端清单写到 <key>.manifest.json；HEAD 只核对长度与 SHA-256 metadata。
  # 5. HTTPS 校验证书，私有 CA 需安装到系统信任库；不自动跳过校验。
  # 6. 所有厂家均要求后端支持条件写入；命令行 --bucket/--key 等仍优先。
